[project]
name = "openai-agents-demo"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "David Armendariz", email = "david.adrian.a.p@gmail.com" }]
dependencies = [
  "openai-agents>=0.0.12",
  "fastapi>=0.115.12",
  "python-dotenv>=1.1.0",
  "uvicorn>=0.34.2",
  "boto3>=1.38.1",
  "azure-identity>=1.21.0",
  "twilio>=9.5.2",
  "requests>=2.32.3",
]
requires-python = "==3.11.*"
readme = "README.md"
license = { text = "MIT" }

[tool.pdm.scripts]
start = "uvicorn src.main:app --reload --log-level info"
start_prod = "uvicorn src.main:app --host 0.0.0.0 --port 8000"

[tool.pdm]
distribution = false
