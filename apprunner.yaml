version: 1.0
runtime: python311
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install --upgrade pip
    - pip3 install pdm
    - pdm export > requirements.txt
    - pip3 install -r requirements.txt
  command: uvicorn src.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: HTTP
  env:
    - name: PYTHONPATH
      value: .
